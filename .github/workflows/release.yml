name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<package.version> tag to recover from main
        required: true
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The archive ships the committed build output, so it must match the source.
      - run: npm run check:dist
      - name: Verify the version, tag source and main commit
        run: |
          set -euo pipefail
          main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test "$main" = "$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            node scripts/release-canonical-archive.ts verify-source --tag "$RELEASE_TAG" --dispatch
          else
            test "$main" = "$GITHUB_SHA"
            node scripts/release-canonical-archive.ts verify-source --tag "$RELEASE_TAG"
          fi
      - name: Pack and select the canonical npm archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm" "$RUNNER_TEMP/canonical"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/npm" > "$RUNNER_TEMP/pack.json"
          filename="$(node -p 'require(process.env.RUNNER_TEMP + "/pack.json")[0].filename')"
          node scripts/release-canonical-archive.ts canonical \
            --name "$(node -p 'require("./package.json").name')" \
            --version "$(node -p 'require("./package.json").version')" \
            --candidate "$RUNNER_TEMP/npm/$filename" \
            --output "$RUNNER_TEMP/canonical/$filename" \
            --report "$RUNNER_TEMP/canonical-report.json"
          echo "NPM_ARCHIVE=$RUNNER_TEMP/canonical/$filename" >> "$GITHUB_ENV"
      - name: Create Release and attach the canonical package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "$RELEASE_TAG" --generate-notes
          filename="$(basename "$NPM_ARCHIVE")"
          have="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq ".assets[] | select(.name == \"$filename\") | .id")"
          if [ -n "$have" ]; then
            mkdir -p "$RUNNER_TEMP/existing-release"
            gh release download "$RELEASE_TAG" --pattern "$filename" --dir "$RUNNER_TEMP/existing-release"
            if ! cmp -s "$RUNNER_TEMP/existing-release/$filename" "$NPM_ARCHIVE"; then
              node scripts/release-canonical-archive.ts compare --candidate "$NPM_ARCHIVE" --other "$RUNNER_TEMP/existing-release/$filename"
              gh release upload "$RELEASE_TAG" "$NPM_ARCHIVE" --clobber
            fi
          else
            gh release upload "$RELEASE_TAG" "$NPM_ARCHIVE"
          fi
      - name: Publish only an unpublished version
        run: |
          set -euo pipefail
          if node -e 'const r=require(process.env.RUNNER_TEMP + "/canonical-report.json");process.exit(r.published ? 0 : 1)'; then
            echo 'The exact canonical archive is already published; npm publish is unnecessary.'
          else
            npm publish "$NPM_ARCHIVE" --access public --provenance --tag next
          fi
